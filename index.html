<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YU100 MFP01</title><style>body{margin:0;background:#f4f4f1;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{position:sticky;top:0;background:#f4f4f1ee;border-bottom:1px solid #ccc;padding:12px 16px;z-index:2}main{max-width:900px;margin:auto;padding:16px 16px 70px}h1{font-size:19px;margin:0}h2{font-size:20px}.sub,.small{font-size:12px;color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.card{background:#fff;border:1px solid #d7d7d2;border-radius:12px;padding:12px;margin:8px 0}.hero{cursor:pointer;text-align:left;width:100%}.selected{outline:2px solid #292d33}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.tag{font-size:12px;background:#ecece7;padding:3px 7px;border-radius:999px}.stats{font-size:13px}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button,select,textarea{font:inherit}button{padding:9px 12px;border:1px solid #ccc;border-radius:9px;background:#fff}button.primary{background:#292d33;color:white;border-color:#292d33}button:disabled{opacity:.45}select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:9px;background:white}textarea{min-height:85px;box-sizing:border-box}.screen{display:none}.active{display:block}.summary{background:#ecece7;border-left:4px solid #292d33;padding:11px;border-radius:8px}.proposal{background:#f0f0ec;border-radius:8px;padding:7px;font-size:13px}.proposals{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:6px}.decision{border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:9px 0;margin:9px 0}.outcome{background:#fafaf7;padding:8px;border-radius:8px}.validation{background:#fff8df;border:1px solid #e6d89a;padding:12px;border-radius:10px;margin-top:14px}nav{display:flex;gap:5px;overflow:auto;margin:8px 0}nav button{white-space:nowrap}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.proposals{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>勇者百年計画 — MFP01</h1><div class="sub">VS-10 Human Validation / 委任 → 観察 → 理解 → 改善</div></header><main><nav><button onclick="go('roster')">Roster</button><button onclick="go('formation')">Formation</button><button onclick="go('mission')">Mission</button><button onclick="go('expedition')">Expedition</button><button onclick="go('aar')">AAR</button></nav><section id="roster" class="screen active"><h2>Roster</h2><p>人物差を能力値だけでなく、行動傾向として把握できるかを見る。</p><div id="rosterGrid" class="grid"></div><div class="bar"><button class="primary" onclick="go('formation')">編成へ</button></div></section><section id="formation" class="screen"><h2>Formation</h2><p>4人を選び、隊長を決める。</p><div id="formationGrid" class="grid"></div><label>隊長<select id="leader"></select></label><div id="partySummary" class="summary"></div><div class="bar"><button onclick="go('roster')">戻る</button><button class="primary" id="missionBtn" onclick="go('mission')">Missionへ</button></div></section><section id="mission" class="screen"><h2>Mission</h2><label>Risk Policy<select id="risk"><option>CONSERVATIVE</option><option selected>NORMAL</option><option>AGGRESSIVE</option></select></label><br><label>Priority<select id="priority"><option>MISSION</option><option selected>SURVIVAL</option><option>RESCUE</option></select></label><div class="summary" style="margin-top:12px">方針は人格を上書きしない。隊長は状況・助言・自身の傾向から現場判断する。</div><div class="bar"><button onclick="go('formation')">戻る</button><button class="primary" onclick="startRun()">遠征開始</button></div></section><section id="expedition" class="screen"><h2>Expedition</h2><div id="runHead" class="summary"></div><div id="eventLog"></div><div class="bar"><button class="primary" id="aarBtn" onclick="go('aar')" disabled>AARへ</button></div></section><section id="aar" class="screen"><h2>After Action Review</h2><div id="aarRoot"></div><div class="bar"><button onclick="go('mission')">同じ編成</button><button class="primary" onclick="go('formation')">編成変更</button><button onclick="go('mission')">方針変更</button></div><div class="validation"><strong>VS-10メモ</strong><p class="small">5〜8遠征後を目安に、次に何を変えたいか、その理由を書く。</p><textarea id="memo" placeholder="例：ハルトを隊長にするなら、危険を止められるアリアを入れたい。"></textarea><button onclick="saveMemo()">保存</button><span id="saved" class="small"></span></div><details><summary>Debug Trace</summary><pre id="debug" class="small"></pre></details></section></main><script>const H=[{id:'H01',n:'ハルト',c:.68,e:.45,r:.72,ri:.85,co:.90,d:.30},{id:'H02',n:'アリア',c:.48,e:.92,r:.62,ri:.25,co:.75,d:.80},{id:'H03',n:'リナ',c:.55,e:.60,r:.78,ri:.35,co:.30,d:.90},{id:'H04',n:'カイル',c:.82,e:.42,r:.55,ri:.90,co:.25,d:.20},{id:'H05',n:'ミナ',c:.45,e:.58,r:.88,ri:.30,co:.95,d:.60},{id:'H06',n:'セラ',c:.42,e:.86,r:.52,ri:.70,co:.45,d:.25},{id:'H07',n:'ロイド',c:.92,e:.30,r:.70,ri:.75,co:.60,d:.75},{id:'H08',n:'エルナ',c:.60,e:.55,r:.76,ri:.50,co:.65,d:.95}];const E=[{s:2,t:'UNKNOWN_ROUTE',title:'未知の分岐路',dg:.72,rw:.65,u:.25,info:.30,a:['PROCEED','SCOUT','AVOID']},{s:4,t:'ENEMY',title:'敵集団との遭遇',dg:.64,rw:.58,u:.40,info:.45,a:['ENGAGE','SCOUT','AVOID']},{s:6,t:'INJURY',title:'隊員の負傷',dg:.58,rw:.45,u:.35,info:.55,a:['CONTINUE','TREAT','RETREAT']},{s:8,t:'STRANDED',title:'遭難者を発見',dg:.68,rw:.45,u:.75,info:.40,a:['RESCUE','CONTINUE_MISSION','REPORT']},{s:10,t:'SUPPLY',title:'補給不足',dg:.62,rw:.55,u:.55,info:.55,a:['PUSH','REDUCE','RETREAT']}];const L={PROCEED:'進行',SCOUT:'偵察',AVOID:'回避',ENGAGE:'交戦',CONTINUE:'続行',TREAT:'応急処置後続行',RETREAT:'撤退',RESCUE:'救助',CONTINUE_MISSION:'任務継続',REPORT:'報告',PUSH:'強行',REDUCE:'目標縮小'};let S=JSON.parse(localStorage.getItem('yu100mfp01')||'null')||{sel:['H01','H02','H07','H05'],leader:'H01',risk:'NORMAL',priority:'SURVIVAL',trust:{},xp:{},runs:0,memos:[],last:null};const hero=id=>H.find(x=>x.id===id),cl=x=>Math.max(0,Math.min(1,x)),ct=x=>2*x-1,grade=x=>x>=.8?'A':x>=.6?'B':x>=.4?'C':'D',trust=(a,b)=>S.trust[a+'>'+b]??.5;function save(){localStorage.setItem('yu100mfp01',JSON.stringify(S))}function traits(h){return[h.ri>=.7?'大胆':h.ri<=.35?'慎重':'中庸',h.co>=.75?'仲間優先':h.co<=.35?'自己保存寄り':'協調型',h.d>=.75?'規律型':h.d<=.35?'現場判断型':'柔軟']}function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function rnd(k){let x=hash(k);x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%1000000)/1000000}function noise(k){return rnd(k+'a')+rnd(k+'b')+rnd(k+'c')+rnd(k+'d')-2}function relAb(h,e){return e.t==='UNKNOWN_ROUTE'?h.e:e.t==='ENEMY'?h.c:h.r}function xp(id,t){const x=S.xp[id+'|'+t]||{n:0,c:0};return x.c*(1-Math.exp(-.45*x.n))}function perceive(h,e,seed){const A=relAb(h,e),X=xp(h.id,e.t),sig=.35*(1-.45*A-.25*X)*(1-.30*e.info),d=cl(e.dg+noise(seed+h.id+'d')*sig),rw=cl(e.rw+noise(seed+h.id+'r')*sig*.65),cf=cl(.20+.35*A+.25*X+.20*e.info);return{d,rw,cf,sig}}function pBias(h,a){const w=.4+.6*h.d;let b=0;if(S.priority==='SURVIVAL'&&['SCOUT','AVOID','RETREAT','TREAT','REPORT','REDUCE'].includes(a))b+=.18*w;if(S.priority==='MISSION'&&['PROCEED','ENGAGE','CONTINUE','CONTINUE_MISSION','PUSH'].includes(a))b+=.18*w;if(S.priority==='RESCUE'&&['RESCUE','TREAT'].includes(a))b+=.22*w;return b}function rBias(h){return(S.risk==='CONSERVATIVE'?-.20:S.risk==='AGGRESSIVE'?.20:0)*(.4+.6*h.d)}function scores(h,e,p){const r=ct(h.ri),c=ct(h.co),g=1-e.info,rb=rBias(h),s={};if(e.t==='UNKNOWN_ROUTE'){s.PROCEED=.80*p.rw-.90*p.d+.75*r+rb+pBias(h,'PROCEED');s.SCOUT=.58*g+.22*p.d-.18*r+pBias(h,'SCOUT');s.AVOID=.88*p.d-.62*p.rw-.58*r-rb+pBias(h,'AVOID')}if(e.t==='ENEMY'){s.ENGAGE=.72*p.rw-.82*p.d+.65*r+.18*h.c+rb+pBias(h,'ENGAGE');s.SCOUT=.45*g+.25*p.d-.16*r+.10*h.e+pBias(h,'SCOUT');s.AVOID=.78*p.d-.50*p.rw-.52*r-rb+pBias(h,'AVOID')}if(e.t==='INJURY'){s.CONTINUE=.55*e.rw-.45*p.d+.45*r-.35*c+rb+pBias(h,'CONTINUE');s.TREAT=.40*c+.28*h.r+.15*(1-h.ri)+pBias(h,'TREAT');s.RETREAT=.48*p.d+.32*c-.38*r-rb+pBias(h,'RETREAT')}if(e.t==='STRANDED'){s.RESCUE=.68*c+.30*e.u-.38*p.d+.18*r+pBias(h,'RESCUE');s.CONTINUE_MISSION=.55*r-.48*c+.24*e.rw+rb+pBias(h,'CONTINUE_MISSION');s.REPORT=.32*h.d+.28*p.d-.12*r+pBias(h,'REPORT')}if(e.t==='SUPPLY'){s.PUSH=.62*r+.26*e.rw-.42*p.d+rb+pBias(h,'PUSH');s.REDUCE=.34*h.d+.30*p.d-.10*r+pBias(h,'REDUCE');s.RETREAT=.58*p.d-.44*r-rb+pBias(h,'RETREAT')}return s}function proposal(h,e,p){const s=scores(h,e,p),a=Object.entries(s).sort((x,y)=>y[1]-x[1]),m=a[0][1]-a[1][1],cf=cl(.55*p.cf+.45*Math.tanh(2.5*Math.max(0,m)));return{a:a[0][0],s,cf}}function decide(party,lead,e,ps,prs,seed){const sc={...prs[lead.id].s},adv=[];for(const h of party){if(h.id===lead.id)continue;const pr=prs[h.id],w=pr.cf*(.5+.5*relAb(h,e))*(.2+.8*trust(lead.id,h.id));adv.push({id:h.id,a:pr.a,w});for(const a of e.a)sc[a]+=.55*w*(a===pr.a?1:-.5)/(party.length-1)}const ar=Object.entries(sc).sort((x,y)=>y[1]-x[1]);let pick=ar[0][0],m=ar[0][1]-ar[1][1];if(m<.12){const T=.07,pa=Math.exp(ar[0][1]/T)/(Math.exp(ar[0][1]/T)+Math.exp(ar[1][1]/T));pick=rnd(seed+'tie')<pa?ar[0][0]:ar[1][0]}return{pick,sc,adv,m}}function fit(e,a){const D=e.dg,R=e.rw,U=e.u,G=1-e.info;if(e.t==='UNKNOWN_ROUTE')return a==='PROCEED'?cl(.45*(1-D)+.30*R+.25*U):a==='SCOUT'?cl(.50*G+.30*D+.20*(1-U)):cl(.55*D+.25*(1-R)+.20*(1-U));if(e.t==='ENEMY')return a==='ENGAGE'?cl(.42*(1-D)+.35*R+.23*U):a==='SCOUT'?cl(.42*G+.28*D+.20*(1-U)+.10*R):cl(.52*D+.28*(1-R)+.20*(1-U));if(e.t==='INJURY')return a==='CONTINUE'?cl(.50*(1-D)+.30*R+.20*U):a==='TREAT'?cl(.45*D+.35*(1-U)+.20*R):cl(.55*D+.30*(1-R)+.15*(1-U));if(e.t==='STRANDED')return a==='RESCUE'?cl(.38*(1-D)+.42*U+.20*(S.priority==='RESCUE'?1:.5)):a==='CONTINUE_MISSION'?cl(.48*(1-U)+.32*R+.20*(S.priority==='MISSION'?1:.5)):cl(.42*D+.32*(1-R)+.26*(1-U));return a==='PUSH'?cl(.38*(1-D)+.35*R+.27*U):a==='REDUCE'?cl(.44*D+.30*(1-U)+.26*R):cl(.55*D+.28*(1-R)+.17*(1-U))}function outcome(party,e,d,seed,st){const avg=k=>party.reduce((z,h)=>z+h[k],0)/party.length,C=e.t==='UNKNOWN_ROUTE'?.75*avg('e')+.25*avg('r'):e.t==='ENEMY'?.70*avg('c')+.30*avg('r'):avg('r'),F=fit(e,d.pick),R=.6*st.health+.25*(1-st.fatigue)+.15*st.supplies,eta=Math.max(-.25,Math.min(.25,noise(seed+'out')*.12)),x=cl(.45*F+.35*C+.20*R+eta),klass=x>=.72?'STRONG SUCCESS':x>=.55?'SUCCESS':x>=.38?'SETBACK':'FAILURE',process=F>=.68?'CONTEXT_ALIGNED':F>=.45?'CONTESTABLE':'HIGH_RISK';return{F,C,R,eta,x,klass,process}}function learn(party,lead,e,prs,d,o){const fs={};e.a.forEach(a=>fs[a]=fit(e,a));const mean=Object.values(fs).reduce((a,b)=>a+b,0)/e.a.length,fb=['SCOUT','ENGAGE','RESCUE','TREAT'].includes(d.pick)?.82:['AVOID','REPORT'].includes(d.pick)?.28:.55;for(const h of party){const k=h.id+'|'+e.t,old=S.xp[k]||{n:0,c:0};S.xp[k]={n:old.n+1,c:cl(old.c+.35*fb*(1-old.c))}}for(const h of party){if(h.id===lead.id)continue;const pr=prs[h.id],ev=fb*(fs[pr.a]-mean),old=trust(lead.id,h.id),delta=.20*ev*pr.cf*(.5+.5*relAb(h,e))*(pr.a===d.pick?1:.65)*(1-.65*Math.abs(2*old-1));S.trust[lead.id+'>'+h.id]=cl(old+delta)} }function run(){S.risk=document.getElementById('risk').value;S.priority=document.getElementById('priority').value;S.runs++;const seed='R'+S.runs,party=S.sel.map(hero),lead=hero(S.leader),st={health:1,fatigue:.05,supplies:1},res=[];for(const e of E){const ps={},prs={};party.forEach(h=>{ps[h.id]=perceive(h,e,seed+e.s);prs[h.id]=proposal(h,e,ps[h.id])});const d=decide(party,lead,e,ps,prs,seed+e.s),o=outcome(party,e,d,seed+e.s,st);learn(party,lead,e,prs,d,o);st.supplies=cl(st.supplies-(o.klass==='FAILURE'||o.klass==='SETBACK'?.10:.05));st.fatigue=cl(st.fatigue+(o.klass==='FAILURE'||o.klass==='SETBACK'?.10:.05));res.push({e,ps,prs,d,o,st:{...st}});if(d.pick==='RETREAT')break}S.last={no:S.runs,party:S.sel.slice(),leader:S.leader,risk:S.risk,priority:S.priority,res,st,status:res.at(-1)?.d.pick==='RETREAT'?'RETREATED':res.at(-1)?.e.s>=10?'SUCCESS':'PARTIAL SUCCESS'};save();return S.last}function reasons(x){const lead=hero(S.last.leader),out=[];if(x.prs[lead.id].a===x.d.pick)out.push(lead.n+'本人も「'+L[x.d.pick]+'」を望んでいた');const sup=x.d.adv.filter(a=>a.a===x.d.pick).sort((a,b)=>b.w-a.w)[0];if(sup){out.push(hero(sup.id).n+'の助言が強く影響した');if(trust(lead.id,sup.id)>=.6)out.push(lead.n+'は'+hero(sup.id).n+'の判断を比較的信頼している')}if(S.last.priority==='SURVIVAL'&&['SCOUT','AVOID','RETREAT','TREAT','REPORT','REDUCE'].includes(x.d.pick))out.push('生存優先方針が判断を後押しした');if(S.last.priority==='MISSION'&&['PROCEED','ENGAGE','CONTINUE','CONTINUE_MISSION','PUSH'].includes(x.d.pick))out.push('任務優先方針が判断を後押しした');if(S.last.priority==='RESCUE'&&['RESCUE','TREAT'].includes(x.d.pick))out.push('救助優先方針が判断を後押しした');return out.slice(0,3)}function renderRoster(){const r=document.getElementById('rosterGrid');r.innerHTML='';H.forEach(h=>{r.innerHTML+=`<div class="card"><strong>${h.n}</strong><div class="stats">戦闘 ${grade(h.c)} / 探索 ${grade(h.e)} / 耐久 ${grade(h.r)}</div><div class="tags">${traits(h).map(t=>'<span class="tag">'+t+'</span>').join('')}</div></div>`})}function renderFormation(){const r=document.getElementById('formationGrid');r.innerHTML='';H.forEach(h=>{const b=document.createElement('button');b.className='card hero '+(S.sel.includes(h.id)?'selected':'');b.innerHTML=`<strong>${h.n}</strong><div class="small">戦闘 ${grade(h.c)} / 探索 ${grade(h.e)} / 耐久 ${grade(h.r)}</div><div class="tags">${traits(h).map(t=>'<span class="tag">'+t+'</span>').join('')}</div>`;b.onclick=()=>{const i=S.sel.indexOf(h.id);if(i>=0){S.sel.splice(i,1);if(S.leader===h.id)S.leader=S.sel[0]||''}else if(S.sel.length<4)S.sel.push(h.id);save();renderFormation()};r.appendChild(b)});const sl=document.getElementById('leader');sl.innerHTML='';S.sel.forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=hero(id).n;o.selected=id===S.leader;sl.appendChild(o)});sl.onchange=()=>{S.leader=sl.value;save();renderFormation()};document.getElementById('missionBtn').disabled=S.sel.length!==4;const hs=S.sel.map(hero),avg=k=>hs.length?hs.reduce((a,h)=>a+h[k],0)/hs.length:0;document.getElementById('partySummary').innerHTML=S.sel.length===4?`戦闘 ${grade(avg('c'))} / 探索 ${grade(avg('e'))} / 耐久 ${grade(avg('r'))}<br>隊長：${hero(S.leader).n} — ${traits(hero(S.leader)).join(' / ')}`:'4人選択してください'}function renderRun(x){document.getElementById('runHead').textContent=`Expedition ${x.no} / Leader ${hero(x.leader).n} / ${x.risk} / ${x.priority}`;const r=document.getElementById('eventLog');r.innerHTML='';x.res.forEach(z=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="small">Sector ${z.e.s}</div><strong>${z.e.title}</strong><div class="proposals">${x.party.map(id=>`<div class="proposal"><b>${hero(id).n}</b><br>→ ${L[z.prs[id].a]}</div>`).join('')}</div><div class="decision"><b>${hero(x.leader).n}は「${L[z.d.pick]}」を選択</b>${reasons(z).map(a=>'<div>・'+a+'</div>').join('')}</div><div class="outcome"><b>Outcome：${z.o.klass}</b><br><span class="small">Process：${z.o.process}</span></div>`;r.appendChild(d)});document.getElementById('aarBtn').disabled=false}function renderAAR(x){const r=document.getElementById('aarRoot');r.innerHTML=`<div class="card"><strong>Expedition ${x.no}</strong><br>Result：${x.status}<br>重要判断：${x.res.length}件</div><h3>Key Decisions</h3>`;x.res.forEach(z=>{r.innerHTML+=`<div class="card"><b>Sector ${z.e.s} — ${z.e.title}</b><br>Decision：${L[z.d.pick]}${reasons(z).map(a=>'<div>・'+a+'</div>').join('')}<div class="small">Outcome：${z.o.klass} / ${z.o.process}</div></div>`});document.getElementById('debug').textContent=JSON.stringify(x,null,2)}function startRun(){if(S.sel.length!==4)return;const x=run();renderRun(x);renderAAR(x);go('expedition')}function saveMemo(){const t=document.getElementById('memo').value.trim();if(!t)return;S.memos.push({run:S.runs,text:t,at:new Date().toISOString()});save();document.getElementById('memo').value='';document.getElementById('saved').textContent=' 保存しました'}function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));if(id==='roster')renderRoster();if(id==='formation')renderFormation();if(id==='mission'){document.getElementById('risk').value=S.risk;document.getElementById('priority').value=S.priority}if(id==='expedition'&&S.last)renderRun(S.last);if(id==='aar'&&S.last)renderAAR(S.last);scrollTo(0,0)}renderRoster();renderFormation();</script></body></html>
